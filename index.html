<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1f2937" />
    <title>SOP Test App</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>SOP Test App</h1>
      <p class="subtitle">Create, edit, save, and export photo notes offline.</p>

      <section class="card">
        <h2 id="form-title">New record</h2>
        <form id="record-form">
          <label for="photo">Photo</label>
          <input id="photo" name="photo" type="file" accept="image/*" capture="environment" />

          <canvas id="photo-preview" class="preview hidden"></canvas>

          <label for="note">Note</label>
          <textarea id="note" name="note" rows="4" maxlength="2000" placeholder="Write your note..."></textarea>

          <div class="form-actions">
            <button type="submit" id="save-btn">Save record</button>
            <button type="button" id="cancel-btn" class="secondary hidden">Cancel edit</button>
            <button type="button" id="delete-btn" class="danger hidden">Delete</button>
          </div>
        </form>
      </section>

      <section class="card actions">
        <button id="export-btn" type="button">Export ZIP</button>
        <label class="import-label" for="import-input">Import ZIP</label>
        <input id="import-input" type="file" accept=".zip,application/zip" />
      </section>

      <section class="card">
        <h2>Saved records</h2>
        <ul id="records-list" class="records-list"></ul>
        <p id="empty-state" class="empty-state">No records saved yet.</p>
      </section>

      <p id="status" class="status" role="status" aria-live="polite"></p>
    </main>

    <script src="vendor/jszip.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
